name: "SP-3: Compile EE (Nuitka)"

# SP-3: Compiles cutctx_ee to native extensions for release.
# Produces a wheel with NO .py source — only .so/.pyd native modules.
# Triggered on publish-ee.yml or manually for testing.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (e.g. 0.26.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run (build but do not publish)"
        required: false
        default: "true"
        type: boolean

jobs:
  compile-ee:
    name: Compile cutctx_ee (Nuitka)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          pip install nuitka ordered-set zstandard build setuptools wheel

      - name: Compile EE modules
        env:
          CUTCTX_LICENSE_HMAC_SECRET: ${{ secrets.CUTCTX_LICENSE_HMAC_SECRET }}
        run: |
          python scripts/compile_ee.py \
            --output-dir dist-ee-compiled \
            --version ${{ inputs.version }}

      # Audit-2026-08-03 H1: a .so older than its .py silently ships superseded
      # code, because the .so shadows the source at import time. Five modules
      # had drifted (including the entitlement fail-closed fixes in
      # billing/client.py and trial.py) before this gate existed.
      - name: Fail on stale EE extensions (H1)
        run: |
          python scripts/check_ee_freshness.py

      - name: Verify signed compiled wheel (V-7)
        env:
          CUTCTX_LICENSE_HMAC_SECRET: ${{ secrets.CUTCTX_LICENSE_HMAC_SECRET }}
        run: |
          EE_WHEEL=$(find dist-ee-compiled -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$EE_WHEEL"
          python scripts/verify_ee_wheel.py \
            --wheel "$EE_WHEEL" \
            --evidence dist-ee-compiled/wheel-verification.json

      - name: Scan for secrets (V-12)
        run: |
          python scripts/sign_artifacts.py scan-secrets --path cutctx_ee

      - name: Upload compiled wheel
        uses: actions/upload-artifact@v4
        with:
          name: cutctx-ee-compiled-wheel
          path: |
            dist-ee-compiled/*.whl
            dist-ee-compiled/wheel-verification.json

      - name: Upload compiled extensions
        uses: actions/upload-artifact@v4
        with:
          name: cutctx-ee-compiled-extensions
          path: dist-ee-compiled/_compiled/**/*.so
