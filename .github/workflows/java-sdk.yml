name: Java SDK tests

on:
  push:
    branches: [ main ]
    paths:
      - 'sdks/java-cutctx/**'
      - '.github/workflows/java-sdk.yml'
  pull_request:
    paths:
      - 'sdks/java-cutctx/**'
      - '.github/workflows/java-sdk.yml'

permissions:
  contents: read

jobs:
  test:
    name: test (Java SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Run Java SDK tests
        run: mvn -B test
        working-directory: sdks/java-cutctx
