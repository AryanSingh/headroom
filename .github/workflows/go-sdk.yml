name: Go SDK tests

on:
  push:
    branches: [ main ]
    paths:
      - 'sdk/go/**'
      - 'sdks/go-cutctx/**'
      - '.github/workflows/go-sdk.yml'
  pull_request:
    paths:
      - 'sdk/go/**'
      - 'sdks/go-cutctx/**'
      - '.github/workflows/go-sdk.yml'

permissions:
  contents: read

jobs:
  test:
    name: test (Go SDKs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Run Go SDK tests (sdk/go)
        run: go test ./...
        working-directory: sdk/go
      - name: Run Go SDK tests (sdks/go-cutctx)
        run: go test ./...
        working-directory: sdks/go-cutctx
