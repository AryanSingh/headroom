replicaCount: 1
image:
  repository: ghcr.io/cutctx/cutctx
  tag: 0.32.0
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''
proxy:
  compression: true
  compressionMode: live_zone
  backend: anthropic
  mode: token
  upstream: ''
  port: 8787
  maxBodyMb: 50
enterprise:
  adminApiKey: ''
  proxyApiKey: ''
  clientApiKey: ''
  corsOrigins: ''
  entitlementTier: ''
sso:
  enabled: false
  providerType: oidc
  discoveryUrl: ''
  jwksUri: ''
  issuer: ''
  audience: ''
audit:
  enabled: true
retention:
  ccrMaxAgeSeconds: 604800
  auditMaxAgeDays: 90
  episodicMaxAgeDays: 30
resources: null
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 10Gi
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi
livenessProbe:
  httpGet:
    path: /livez
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
startupProbe:
  httpGet:
    path: /livez
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 30
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
podDisruptionBudget:
  enabled: true
  minAvailable: 1
service:
  type: ClusterIP
  port: 80
  targetPort: 8787
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}
ingress:
  enabled: false
  className: ''
  annotations: {}
  hosts:
    - host: cutctx.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
serviceAccount:
  create: true
  name: ''
  annotations: {}
rbac:
  create: true
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
extraEnv: []
extraVolumes: []
extraVolumeMounts: []
