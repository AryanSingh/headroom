# Standalone package — not a member of the repo Cargo workspace.
[workspace]

[package]
name = "cutctx-control"
version = "0.1.0"
description = "CutCtx Control — tray app for proxy lifecycle, features, and client setup"
authors = ["Cutctx Labs"]
license = "LicenseRef-Cutctx-Commercial"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "cutctx_control_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
ureq = { version = "2.12", features = ["json"] }
dirs = "6"
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"
